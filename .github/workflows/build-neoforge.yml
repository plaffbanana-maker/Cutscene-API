name: Build NeoForge Jar

on:
  workflow_dispatch:
  push:
    branches:
      - "1.21.1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 1.21.1
        uses: actions/checkout@v4
        with:
          ref: 1.21.1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Confirm Java version
        run: java -version

      - name: Build NeoForge jar
        run: |
          chmod +x ./gradlew
          ./gradlew :neoforge:build

      - name: Remove bad NeoForge refmap if present
        run: |
          cd neoforge/build/libs
          for jar in *neoforge*.jar; do
            if [[ "$jar" != *sources* && "$jar" != *javadoc* && "$jar" != *dev-shadow* ]]; then
              zip -d "$jar" cutscene_api.common.refmap.json || true
            fi
          done

      - name: Upload NeoForge jar
        uses: actions/upload-artifact@v4
        with:
          name: cutscene-api-neoforge-1.21.1
          path: |
            neoforge/build/libs/*neoforge*.jar
            !neoforge/build/libs/*sources*.jar
            !neoforge/build/libs/*javadoc*.jar
            !neoforge/build/libs/*dev-shadow*.jar
